[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-foundry"
version = "0.0.0"
description = "Governed, configuration-driven dataset engineering platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit",
  "mypy",
  "pip-audit",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["dataset_foundry*"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
