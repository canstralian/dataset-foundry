name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Restrictive default token permissions (least privilege)
permissions:
  contents: read

# Cancel stale runs for same branch/PR to speed feedback
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint, Type Check, Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Useful for lineage/versioning metadata if tests or tooling inspect git history
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Install project + optional dev deps if available.
          # Handles both pyproject and requirements-style repos.
          if [[ -f "pyproject.toml" ]]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
          fi

          if [[ -f "requirements.txt" ]]; then
            python -m pip install -r requirements.txt
          fi

          if [[ -f "requirements-dev.txt" ]]; then
            python -m pip install -r requirements-dev.txt
          fi

          # Ensure core QA tools exist even if not declared yet
          python -m pip install \
            pytest pytest-cov \
            ruff \
            mypy \
            bandit \
            pip-audit

      - name: Validate Python environment
        run: |
          python --version
          pip --version
          pip list --format=columns

      - name: Lint (Ruff)
        run: |
          # Fails on lint issues (PEP 8 + quality rules as configured in repo)
          ruff check .

      - name: Format check (Ruff format)
        run: |
          # Non-destructive formatting check only
          ruff format --check .

      - name: Static typing (Mypy)
        run: |
          # If mypy is partially adopted, tighten config in pyproject incrementally
          mypy .

      - name: Security scan (Bandit)
        run: |
          # Recursive source scan; adjust exclusions as needed in pyproject/bandit config
          bandit -q -r .

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          # Fails CI on known vulnerable deps
          pip-audit

      - name: Run tests with coverage
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          pytest -q --maxfail=1 --disable-warnings \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
