name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality Gate (Ruff, Mypy, Bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel

          if [[ -f "pyproject.toml" ]]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
          fi
          if [[ -f "requirements.txt" ]]; then
            python -m pip install -r requirements.txt
          fi
          if [[ -f "requirements-dev.txt" ]]; then
            python -m pip install -r requirements-dev.txt
          fi

          python -m pip install ruff mypy bandit pip-audit

      - name: Lint (Ruff)
        run: python -m ruff check .

      - name: Format check (Ruff)
        run: python -m ruff format --check .

      - name: Type check (Mypy)
        run: python -m mypy .

      - name: Security scan (Bandit)
        run: python -m bandit -q -r .

      - name: Dependency vulnerability audit
        run: python -m pip_audit

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel

          if [[ -f "pyproject.toml" ]]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
          fi
          if [[ -f "requirements.txt" ]]; then
            python -m pip install -r requirements.txt
          fi
          if [[ -f "requirements-dev.txt" ]]; then
            python -m pip install -r requirements-dev.txt
          fi

          python -m pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest -m "not integration" \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  integration-tests-postgres:
    name: Integration Tests (PostgreSQL, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dataset_foundry_test
          POSTGRES_USER: dataset_foundry
          POSTGRES_PASSWORD: dataset_foundry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataset_foundry -d dataset_foundry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dataset_foundry:dataset_foundry@localhost:5432/dataset_foundry_test
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: dataset_foundry_test
      PGUSER: dataset_foundry
      PGPASSWORD: dataset_foundry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel

          if [[ -f "pyproject.toml" ]]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
          fi
          if [[ -f "requirements.txt" ]]; then
            python -m pip install -r requirements.txt
          fi
          if [[ -f "requirements-dev.txt" ]]; then
            python -m pip install -r requirements-dev.txt
          fi

          python -m pip install pytest psycopg[binary]

      - name: Wait for Postgres
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Run integration tests
        run: python -m pytest -m "integration" -q
